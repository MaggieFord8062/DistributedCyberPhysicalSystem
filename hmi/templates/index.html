
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Cyber-Physical System - HMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 2rem; color: #00adb5; }
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #222831;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .card h3 { margin: 0 0 10px 0; color: #eeeeee; font-size: 1.2rem; }
        .value { font-size: 2.5rem; font-weight: bold; color: #00adb5; }
        .status-box {
            margin: 15px;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .ONLINE { background-color: #28a745; color: white; }
        .OFFLINE { background-color: #dc3545; color: white; }
        .timestamp { margin-top: 20px; color: #aaaaaa; font-size: 1rem; }
    </style>
</head>
<body>

    <h1>Sensor Monitoring HMI</h1>

    <div>
        <div id="device-status-box" class="status-box OFFLINE">
            Device Status: <span id="device-status-text">OFFLINE</span>
        </div>

        <div id="sensor-status-box" class="status-box OFFLINE">
            Sensor Status: <span id="sensor-status-text">OFFLINE</span>
        </div>
    </div>

    <div class="card-container">
        <div class="card">
            <h3>Temperature</h3>
            <div class="value"><span id="temp">--</span> °C</div>
        </div>
        <div class="card">
            <h3>Humidity</h3>
            <div class="value"><span id="hum">--</span> %</div>
        </div>
        <div class="card">
            <h3>Pressure</h3>
            <div class="value"><span id="press">--</span> hPa</div>
        </div>
    </div>

    <div class="timestamp">Last Updated: <span id="time">Never</span></div>

    <script>
        // Fetch latest data from Flask API every 2 seconds
        setInterval(async () => {
            try {
                let response = await fetch('/api/data');
                let data = await response.json();

                if (data.temperature !== "--") {
                    document.getElementById('temp').innerText =
                        Number(data.temperature).toFixed(2);
                }

                if (data.humidity !== "--") {
                    document.getElementById('hum').innerText =
                        Number(data.humidity).toFixed(2);
                }

                if (data.pressure !== "--") {
                    document.getElementById('press').innerText =
                        Number(data.pressure).toFixed(2);
                }

                if (data.timestamp !== "Waiting for data...") {
                    const timestamp = new Date(data.timestamp);
                    document.getElementById('time').innerText =
                        timestamp.toLocaleString('en-US', {
                            month: 'long',
                            day: 'numeric',
                            year: 'numeric',
                            hour: 'numeric',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: true
                        });
                }

                // Device status comes from UDP heartbeat (Socket 2)
                let deviceStatus = data.device_status;
                document.getElementById('device-status-box').className =
                    "status-box " + deviceStatus;
                document.getElementById('device-status-text').innerText =
                    deviceStatus;

                // Sensor status comes from TCP sensor readings (Socket 1)
                let sensorStatus = data.status;
                document.getElementById('sensor-status-box').className =
                    "status-box " + sensorStatus;
                document.getElementById('sensor-status-text').innerText =
                    sensorStatus;

            } catch (err) {
                console.error("Failed to fetch sensor data", err);
            }
        }, 2000);
    </script>

</body>
</html>
