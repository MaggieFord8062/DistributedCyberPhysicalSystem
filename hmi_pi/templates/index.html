<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Cyber-Physical System - HMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 2rem; color: #00adb5; }
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #222831;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .card h3 { margin: 0 0 10px 0; color: #eeeeee; font-size: 1.2rem; }
        .value { font-size: 2.5rem; font-weight: bold; color: #00adb5; }
        .status-box {
            margin-top: 30px;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .ONLINE { background-color: #28a745; color: white; }
        .OFFLINE { background-color: #dc3545; color: white; }
        .timestamp { margin-top: 20px; color: #aaaaaa; font-size: 1rem; }
    </style>
</head>
<body>

    <h1>Sensor Monitoring HMI</h1>
    
    <div id="status-box" class="status-box OFFLINE">
        Sense HAT Status: <span id="status-text">OFFLINE</span>
    </div>

    <div class="card-container">
        <div class="card">
            <h3>Temperature</h3>
            <div class="value"><span id="temp">--</span> °C</div>
        </div>
        <div class="card">
            <h3>Humidity</h3>
            <div class="value"><span id="hum">--</span> %</div>
        </div>
        <div class="card">
            <h3>Pressure</h3>
            <div class="value"><span id="press">--</span> hPa</div>
        </div>
    </div>

    <div class="timestamp">Last Updated: <span id="time">Never</span></div>

    <script>
        // Fetch latest data from Flask API every 2 seconds
        setInterval(async () => {
            try {
                let response = await fetch('/api/data');
                let data = await response.json();
                
                document.getElementById('temp').innerText = data.temperature;
                document.getElementById('hum').innerText = data.humidity;
                document.getElementById('press').innerText = data.pressure;
                document.getElementById('time').innerText = data.timestamp;

                let statusBox = document.getElementById('status-box');
                let statusText = document.getElementById('status-text');
                
                statusBox.className = "status-box " + data.status;
                statusText.innerText = data.status;
            } catch (err) {
                console.error("Failed to fetch sensor data", err);
            }
        }, 2000);
    </script>

</body>
</html>
